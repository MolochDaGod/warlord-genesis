    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var raceId = q.get("raceId") || q.get("race");
          var fromOpen =
            q.get("from") === "open" || q.get("open") === "1" || q.get("characterId") || raceId;
          if (!fromOpen) return;
          var map = {
            "western-kingdoms": "human",
            "race-western-kingdoms": "human",
            wk: "human",
            barbarians: "barbarian",
            "high-elves": "elf",
            dwarves: "dwarf",
            orcs: "orc",
            undead: "undead",
          };
          var race = map[String(raceId || "").toLowerCase()] || raceId || "human";
          sessionStorage.setItem("grudge.open.launch", "1");
          sessionStorage.setItem("gw_open_launch", "1");
          if (q.get("characterId")) {
            sessionStorage.setItem("grudge.open.selectedCharacterId", q.get("characterId"));
            sessionStorage.setItem("gw_open_character_id", q.get("characterId"));
          }
          if (raceId) {
            sessionStorage.setItem("grudge.open.raceId", raceId);
            sessionStorage.setItem("gw_open_race_id", race);
          }
          if (q.get("baseId")) {
            sessionStorage.setItem("grudge.open.baseId", q.get("baseId"));
            sessionStorage.setItem("gw_open_base_id", q.get("baseId"));
          }
        } catch (e) {}
      })();
    </script>
