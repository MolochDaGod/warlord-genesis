    <style>
      #gw-boot{position:fixed;inset:0;z-index:1;display:grid;place-items:center;background:#080c14;color:#e8eef8;font-family:Cinzel,Georgia,serif;text-align:center;padding:24px}
      #gw-boot .spin{width:36px;height:36px;margin:0 auto 16px;border:2px solid #2a3548;border-top-color:#e0b252;border-radius:50%;animation:gwboot .7s linear infinite}
      #gw-boot p{margin:6px 0;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:#8fa3c4}
      #gw-boot strong{display:block;font-size:18px;letter-spacing:.18em;color:#f0e6d0;margin-bottom:8px}
      @keyframes gwboot{to{transform:rotate(360deg)}}

  <body>
    <!-- #root MUST exist before gw-core createRoot (classic scripts are not deferred) -->
    <div id="root">
      <div id="gw-boot" aria-live="polite">
        <div>
          <div class="spin" aria-hidden="true"></div>
          <strong>Warlord Genesis</strong>
          <p id="gw-boot-msg">Loading warcamp…</p>
          <p id="gw-boot-sub">Toon RTS · CraftPix HUD · play kit</p>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var raceId = q.get("raceId") || q.get("race");
          var fromOpen =
            q.get("from") === "open" || q.get("open") === "1" || q.get("characterId") || raceId;
          if (!fromOpen) return;
          var map = {
            "western-kingdoms": "human",
            "race-western-kingdoms": "human",
            wk: "human",
            barbarians: "barbarian",
            "high-elves": "elf",
            dwarves: "dwarf",
            orcs: "orc",
            undead: "undead",
          };
          var race = map[String(raceId || "").toLowerCase()] || raceId || "human";
          sessionStorage.setItem("grudge.open.launch", "1");
          if (q.get("characterId"))
            sessionStorage.setItem("grudge.open.selectedCharacterId", q.get("characterId"));
          if (raceId) sessionStorage.setItem("grudge.open.raceId", raceId);
          if (q.get("baseId")) sessionStorage.setItem("grudge.open.baseId", q.get("baseId"));
          if (q.get("characterName"))
            sessionStorage.setItem("grudge.open.characterName", q.get("characterName"));
          if (!q.get("race") && race) {
            var u = new URL(location.href);
            u.searchParams.set("race", race);
            history.replaceState(null, "", u);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (async function () {
        try {
          var msg = document.getElementById("gw-boot-msg");
          if (msg) msg.textContent = "Purging old caches…";
          if (navigator.serviceWorker) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if (window.caches && caches.keys) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
          if (msg) msg.textContent = "Loading warcamp…";
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        fetch("/api/v1/play-kit", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var el = document.getElementById("gw-boot-sub");
            if (!el || !d) return;
            el.textContent = d.ok
              ? "play kit ready · Toon RTS · CraftPix"
              : "play kit degraded · loading anyway";
          })
          .catch(function () {});
      })();
    </script>
